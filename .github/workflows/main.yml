# GitHub Actions CI workflow

name: CI

on:
  # Run on pushes and pull requests to the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js (example: adjust version if needed)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run tests
      - name: Run tests
        run: npm test

      # Example: Add build step if applicable
      - name: Build project
        run: npm run build